<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#22c55e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PriceEngine">
  <title>Sign Up - Global Price Comparison Engine</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 420px; }
    .logo { text-align: center; margin-bottom: 32px; }
    .logo a { font-size: 1.5rem; font-weight: 800; color: #22c55e; text-decoration: none; }
    .logo i { margin-right: 8px; }
    h2 { text-align: center; margin-bottom: 8px; font-size: 1.5rem; }
    p.subtitle { text-align: center; color: #64748b; margin-bottom: 24px; font-size: 0.9rem; }
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-weight: 500; font-size: 0.85rem; }
    input { width: 100%; padding: 12px 16px; border-radius: 10px; border: 1px solid #e2e8f0; font-size: 1rem; outline: none; transition: border-color 0.2s; }
    input:focus { border-color: #22c55e; }
    .btn { width: 100%; padding: 14px; border-radius: 10px; border: none; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .btn-primary { background: #22c55e; color: white; margin-top: 8px; }
    .btn-primary:hover { background: #16a34a; }
    .switch { text-align: center; margin-top: 20px; color: #64748b; font-size: 0.9rem; }
    .switch a { color: #22c55e; text-decoration: none; font-weight: 500; }
    .alert { padding: 12px; border-radius: 8px; margin-bottom: 16px; display: none; font-size: 0.85rem; }
    .alert.active { display: block; }
    .alert.error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    .alert.success { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo"><a href="/"><i class="fas fa-search-dollar"></i>PriceEngine</a></div>
    <h2>Create Account</h2>
    <p class="subtitle">Start saving money today</p>
    <div class="alert" id="alert"></div>
    <form id="registerForm">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="name" placeholder="John Doe" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Min 6 characters" required>
      </div>
      <button type="submit" class="btn btn-primary">Create Account</button>
    </form>
    <div class="switch">Already have an account? <a href="/login.html">Sign In</a></div>
  </div>
  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alert = document.getElementById('alert');
      alert.className = 'alert';
      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: document.getElementById('name').value, email: document.getElementById('email').value, password: document.getElementById('password').value })
        });
        const data = await res.json();
        if (res.ok) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          window.location.href = '/';
        } else {
          alert.textContent = data.error || 'Registration failed';
          alert.className = 'alert error active';
        }
      } catch (err) {
        alert.textContent = 'Network error. Please try again.';
        alert.className = 'alert error active';
      }
    });
  </script>
</body>
</html>
