<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to Store...</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:-apple-system,BlinkMacSystemFont,'Inter',sans-serif; background:#f3f3f7; display:flex; align-items:center; justify-content:center; min-height:100vh; text-align:center; padding:20px; }
    .box { background:#fff; border-radius:16px; padding:40px 30px; max-width:340px; width:100%; box-shadow:0 4px 20px rgba(0,0,0,.08); }
    .spinner { width:48px; height:48px; border:4px solid #e5e5ea; border-top-color:#22c55e; border-radius:50%; animation:spin .8s linear infinite; margin:0 auto 20px; }
    @keyframes spin { to { transform:rotate(360deg); } }
    h1 { font-size:1.2rem; color:#1c1c1e; margin-bottom:8px; }
    p { color:#6b7280; font-size:.9rem; line-height:1.5; }
    .store { font-weight:700; color:#22c55e; }
    .footer { margin-top:24px; font-size:.75rem; color:#8e8e93; }
    .footer a { color:#22c55e; text-decoration:none; }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <h1>Taking you to the store</h1>
    <p>Please wait while we redirect you to <span class="store" id="storeName">the store</span>...</p>
    <div class="footer">Powered by <a href="/">PriceEngine</a></div>
  </div>
  <script>
    (function(){
      var params=new URLSearchParams(window.location.search);
      var url=params.get('url');
      var store='the store';
      if(url){
        try{
          var u=new URL(url);
          var host=u.hostname.replace(/^www\./,'');
          if(host.includes('amazon')) store='Amazon';
          else if(host.includes('ebay')) store='eBay';
          else if(host.includes('walmart')) store='Walmart';
          else if(host.includes('aliexpress')) store='AliExpress';
          else if(host.includes('shein')) store='Shein';
          else store=host.split('.')[0];
          store=store.charAt(0).toUpperCase()+store.slice(1);
        }catch(e){}
        document.getElementById('storeName').textContent=store;
        window.location.replace(url);
      } else {
        window.location.href='/';
      }
    })();
  </script>
</body>
</html>
