<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Register - PriceEngine</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: #f2f2f7; color: #1c1c1e; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .register-card { background: #fff; border-radius: 24px; padding: 40px 32px; width: 100%; max-width: 400px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
    .logo { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 1.5rem; font-weight: 800; color: #22c55e; text-decoration: none; margin-bottom: 30px; }
    .logo i { font-size: 1.8rem; }
    h2 { text-align: center; margin-bottom: 8px; font-size: 1.4rem; }
    .subtitle { text-align: center; color: #8e8e93; margin-bottom: 28px; font-size: 0.95rem; }
    .form-group { margin-bottom: 18px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.9rem; }
    input[type="email"], input[type="password"], input[type="text"] {
      width: 100%; padding: 14px 16px; border: 1px solid #e5e5ea; border-radius: 14px;
      font-size: 1rem; outline: none; background: #fafafa;
    }
    input:focus { border-color: #22c55e; background: #fff; }
    .btn-submit {
      width: 100%; padding: 16px; background: #22c55e; color: #fff; border: none;
      border-radius: 14px; font-size: 1.05rem; font-weight: 700; cursor: pointer; margin-top: 10px;
    }
    .btn-submit:hover { background: #16a34a; }
    .btn-submit:disabled { background: #c7c7cc; cursor: not-allowed; }
    .divider { text-align: center; margin: 24px 0; color: #8e8e93; font-size: 0.85rem; position: relative; }
    .divider::before, .divider::after { content: ''; position: absolute; top: 50%; width: 80px; height: 1px; background: #e5e5ea; }
    .divider::before { left: 0; }
    .divider::after { right: 0; }
    .login-link { text-align: center; margin-top: 20px; color: #8e8e93; font-size: 0.95rem; }
    .login-link a { color: #22c55e; font-weight: 600; text-decoration: none; }
    .error-msg { background: #fff2f2; color: #ff3b30; padding: 12px 16px; border-radius: 12px; margin-bottom: 16px; font-size: 0.9rem; display: none; }
    .success-msg { background: #f0fdf4; color: #16a34a; padding: 12px 16px; border-radius: 12px; margin-bottom: 16px; font-size: 0.9rem; display: none; }
  </style>
</head>
<body>
  <div class="register-card">
    <a href="index.html" class="logo"><i class="fas fa-search-dollar"></i> PriceEngine</a>
    <h2>Create Account</h2>
    <p class="subtitle">Join PriceEngine to save favorites and track prices</p>
    <div class="error-msg" id="errorMsg"></div>
    <div class="success-msg" id="successMsg"></div>
    <form id="registerForm">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="name" placeholder="John Doe" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Min 6 characters" required minlength="6">
      </div>
      <button type="submit" class="btn-submit" id="submitBtn">Create Account</button>
    </form>
    <div class="divider">or</div>
    <div class="login-link">Already have an account? <a href="login.html">Login</a></div>
  </div>

  <script>
    document.getElementById('registerForm').addEventListener('submit', function(e) {
      e.preventDefault();
      var name = document.getElementById('name').value.trim();
      var email = document.getElementById('email').value.trim().toLowerCase();
      var password = document.getElementById('password').value;
      var btn = document.getElementById('submitBtn');
      var errorDiv = document.getElementById('errorMsg');
      var successDiv = document.getElementById('successMsg');

      errorDiv.style.display = 'none';
      successDiv.style.display = 'none';

      if (name.length < 2) { errorDiv.textContent = 'Name must be at least 2 characters'; errorDiv.style.display = 'block'; return; }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { errorDiv.textContent = 'Invalid email format'; errorDiv.style.display = 'block'; return; }
      if (password.length < 6) { errorDiv.textContent = 'Password must be at least 6 characters'; errorDiv.style.display = 'block'; return; }

      btn.disabled = true;
      btn.textContent = 'Creating account...';

      fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: name, email: email, password: password })
      })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (data.success) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          successDiv.textContent = 'Account created! Redirecting...';
          successDiv.style.display = 'block';
          setTimeout(function() { window.location.href = 'index.html'; }, 800);
        } else {
          errorDiv.textContent = data.message || 'Registration failed';
          errorDiv.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Create Account';
        }
      })
      .catch(function(err) {
        errorDiv.textContent = 'Network error. Please try again.';
        errorDiv.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Create Account';
      });
    });
  </script>
</body>
</html>
